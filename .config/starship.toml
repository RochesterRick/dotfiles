# Rick's Starship prompt
# File: ~/.config/starship.toml
#
# Designed to be:
# - easy to spot while scrolling through long terminal output
# - readable from a distance
# - useful for Git, Distrobox, and Python projects
#
# Tweak colors, symbols, or module order whenever you like.

add_newline = true
command_timeout = 1000

palette = "rick"

format = """
$username\
[@](bold bright-black)\
$hostname\
$container\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

[palettes.rick]
cyan = "#33e6e6"
green = "#39ff88"
yellow = "#ffd75f"
red = "#ff5f5f"
purple = "#d787ff"
blue = "#5fafff"
gray = "#808080"

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold blue"
format = "[$hostname]($style) "

[container]
symbol = "󰆧 "
style = "bold purple"
format = "[\\[$symbol$name\\]]($style) "

[directory]
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾"
style = "bold cyan"
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "≠${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol${pyenv_prefix}(${version} )(\\($virtualenv\\))]($style) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "bold yellow"
format = "[󰔛 $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

